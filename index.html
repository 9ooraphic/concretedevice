<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Concrete Device — All Night Party</title>
  <meta name="description" content="Concrete Device 26 S/S Guilty Pleasure — All Night Party, 2026.10.16. (FRI) 18PM — 06AM" />
  <link rel="preload" as="image" href="bg.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 화면 고정: 위아래 스크롤·튕김·확대 없음 */
    html, body {
      background: #ffffff;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* ── 포스터: 배경 = bg.svg (1080 × 1760, 벡터) ─────── */
    .poster {
      position: relative;
      width: min(100vw, 100vh * 1080 / 1760);   /* 구형 브라우저용 */
      width: min(100vw, 100dvh * 1080 / 1760);
      aspect-ratio: 1080 / 1760;
      background: #ffffff url('bg.svg') center / 100% 100% no-repeat;
    }

    /* ── 3D 사진 기둥 영역 ───────────────────────────
       .band = 위아래 글자 사이 빈 공간 (이 밖으로는 안 보임) */
    /* .band = 포스터 전체를 덮는 터치 영역. 잘라내지 않아서
       크게 돌아가면 배경 글자 위로 겹쳐 보임 */
    .band {
      position: absolute;
      inset: 0;
      z-index: 1;
      touch-action: none;        /* 폰에서 끌어도 화면이 같이 움직이지 않게 */
      cursor: grab;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .band.dragging { cursor: grabbing; }
    .slides {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }
    .stage, .ring {
      position: absolute;
      inset: 0;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }
    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #e4e4e4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #9a9a9a;
    }
    .face img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* 옆으로 돌아간 면일수록 어두워지는 그림자 */
    .face .shade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
    }
    /* 기둥 윗면 / 아랫면 (오각형) */
    .cap {
      position: absolute;
      left: 50%;
      top: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cap svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .cap img {
      position: relative;
      width: 62%;
      height: 62%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* 바닥에 깔리는 흐린 그림자 */
    .floor {
      position: absolute;
      left: 50%;
      height: 6%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0,0,0,.28), rgba(0,0,0,0));
      pointer-events: none;
    }
    /* ── 처음 열 때 잠깐 뜨는 안내 화면 ───────────── */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #fff;
      color: #0040ff;          /* ← 안내 화면 색 (쨍한 파랑) */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -0.04em;
      transition: opacity .5s ease, visibility .5s;
    }
    .intro.hide { opacity: 0; visibility: hidden; }
    .intro .logo {
      width: 40px; height: 40px;
      background: currentColor;               /* 로고도 글자색과 같은 파랑 */
      -webkit-mask: url('up.svg') center / contain no-repeat;
      mask: url('up.svg') center / contain no-repeat;
      animation: spin 1.6s linear infinite;
    }
    .intro .msg { font-size: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<main class="poster" aria-label="All Night Party — Concrete Device 26 S/S Guilty Pleasure, 2026.10.16. (FRI) 18PM — 06AM, B1, 14, Yonsei-ro 7-gil, Seodaemun-gu, Seoul">
  <div class="band" id="band">
    <div class="floor" id="floor"></div>
    <section class="slides" id="slides" aria-label="Concrete Device 26 S/S lookbook"></section>
  </div>
</main>

<div class="intro" id="intro" aria-hidden="true">
  <div class="logo"></div>
  <div class="msg" id="introMsg"></div>
</div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   설정값
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* images 폴더에 넣은 파일 이름 — 순서대로 돌아감 */
const IMAGES = [
  'images/01.jpg',
  'images/02.jpg',
  'images/03.jpg',
  'images/04.jpg',
  'images/05.jpg',
];
/* 처음 안내 화면 */
const INTRO_TEXT = 'Scroll the page';   // ← 안내 문구
const INTRO_MS   = 500;              // ← 안내 화면이 떠 있는 최소 시간 (ms)

const TOP_IMAGE    = 'up.svg';     // ← 윗면에 들어가는 그림
const BOTTOM_IMAGE = 'under.svg';  // ← 아랫면에 들어가는 그림

/* 움직임 */
const AUTO_SPEED  = 55;    // ← 기본 회전 속도 (도/초) — 클수록 빠름, 360이면 1초에 한 바퀴
const DRAG_SPEED  = 0.7;   // ← 손가락 1px 당 몇 도 돌아가는지
const FLING_DECAY = 1.4;   // ← 손 뗀 뒤 관성이 줄어드는 빠르기 (작을수록 오래 돎)
const RETURN      = 1.2;   // ← 손 뗀 뒤 기본 기울기·속도로 돌아오는 빠르기

/* 3D 느낌 */
const TILT_DEG    = 10;    // ← 기본 상태에서 윗면이 뒤로 기울어 위가 모여 보이는 정도
const PERSPECTIVE = 1.1;   // ← 원근 강도 (작을수록 강함, 포스터 가로폭 대비)
const SHADE       = 0.6;   // ← 옆면이 어두워지는 정도 (0~1)

/* 사진 칸 크기 (포스터 1080×1760 기준 px) */
const MAX_W = 760;
const MAX_H = 520;
const CENTER_Y = 900;                        // 칸의 세로 중심
const DEFAULT_RATIO = 815 / 387;             // 사진이 없을 때 쓰는 비율

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   3D 회전 기둥
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const poster = document.querySelector('.poster');
const band   = document.getElementById('band');
const box    = document.getElementById('slides');
const floor  = document.getElementById('floor');
const stage  = document.createElement('div');
stage.className = 'stage';
box.appendChild(stage);

const N = IMAGES.length;
const STEP = 360 / N;
const K = 1 / (2 * Math.tan(Math.PI / N));    // 반지름 = 칸 너비 × K
const RAD = Math.PI / 180;
const ratios = IMAGES.map(() => DEFAULT_RATIO);

const faces = IMAGES.map((src, i) => {
  const face = document.createElement('div');
  face.className = 'face';
  face.textContent = `IMAGE ${String(i + 1).padStart(2, '0')}`;  // 파일 없을 때 자리표시
  const img = new Image();
  img.alt = '';
  img.decoding = 'async';
  img.draggable = false;
  img.onload = () => { ratios[i] = img.naturalWidth / img.naturalHeight; };
  img.onerror = () => img.remove();
  img.src = src;
  const shade = document.createElement('div');
  shade.className = 'shade';
  face.append(img, shade);
  stage.appendChild(face);
  return { el: face, shade };
});

/* 윗면·아랫면: 기둥 단면과 같은 정다각형 (SVG로 그림) */
const SVGNS = 'http://www.w3.org/2000/svg';
function makeCap(src, top) {
  const cap = document.createElement('div');
  cap.className = 'cap';
  const pts = [];
  for (let k = 0; k < N; k++) {
    const a = (k * STEP + STEP / 2) * RAD;
    const y = top ? 50 + 50 * Math.cos(a) : 50 - 50 * Math.cos(a);
    pts.push(`${(50 + 50 * Math.sin(a)).toFixed(3)},${y.toFixed(3)}`);
  }
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  const poly = document.createElementNS(SVGNS, 'polygon');
  poly.setAttribute('points', pts.join(' '));
  poly.setAttribute('fill', '#f2f2f2');
  const shade = document.createElementNS(SVGNS, 'polygon');
  shade.setAttribute('points', pts.join(' '));
  shade.setAttribute('fill', '#000');
  shade.setAttribute('fill-opacity', '0');
  svg.append(poly);
  const img = new Image();
  img.alt = '';
  img.draggable = false;
  img.src = src;
  const svg2 = document.createElementNS(SVGNS, 'svg');   // 그림 위에 덮는 그림자
  svg2.setAttribute('viewBox', '0 0 100 100');
  svg2.setAttribute('preserveAspectRatio', 'none');
  svg2.append(shade);
  cap.append(svg, img, svg2);
  stage.appendChild(cap);
  return { el: cap, shade, top };
}
const caps = [makeCap(TOP_IMAGE, true), makeCap(BOTTOM_IMAGE, false)];

/* ── 회전 계산 (쿼터니언) ───────────────────────
   손가락 방향 그대로 어느 쪽으로든 360° 굴릴 수 있고,
   뒤집힌 상태에서도 방향이 꼬이지 않음 */
const qMul = (a, b) => [
  a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
  a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
  a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
  a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0],
];
const qAxis = (x, y, z, deg) => {
  const h = deg * RAD / 2, s = Math.sin(h);
  return [Math.cos(h), x * s, y * s, z * s];
};
const qNorm = q => { const l = Math.hypot(...q) || 1; return q.map(v => v / l); };
function qSlerp(a, b, t) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0) { b = b.map(v => -v); d = -d; }
  if (d > 0.9995) return qNorm(a.map((v, i) => v + (b[i] - v) * t));
  const th = Math.acos(d), s = Math.sin(th);
  const wa = Math.sin((1 - t) * th) / s, wb = Math.sin(t * th) / s;
  return a.map((v, i) => v * wa + b[i] * wb);
}
/* 회전 행렬 (CSS 좌표: x 오른쪽, y 아래, z 화면 앞) */
function qMat(q) {
  const [w, x, y, z] = q;
  return [
    1 - 2*(y*y + z*z), 2*(x*y - w*z),     2*(x*z + w*y),
    2*(x*y + w*z),     1 - 2*(x*x + z*z), 2*(y*z - w*x),
    2*(x*z - w*y),     2*(y*z + w*x),     1 - 2*(x*x + y*y),
  ];
}
const baseQ = spin => qMul(qAxis(1, 0, 0, TILT_DEG), qAxis(0, 1, 0, -spin));

let spin = 0;                 // 자동 회전 각도
let q = baseQ(0);             // 지금 기둥 방향
let flingX = 0, flingY = 0;   // 손 뗄 때 던진 속도 (도/초, 화면 기준)
let scale = 1;

/* 사진 비율 → 칸 크기. 어느 방향으로 돌려도 화면 밖으로 안 나가게
   기둥 전체를 감싸는 구의 반지름을 MAX_RADIUS 이하로 제한 */
const MAX_RADIUS = 450;
function sizeFor(i) {
  const r = ratios[((i % N) + N) % N];
  let w = MAX_W, h = MAX_W / r;
  if (h > MAX_H) { h = MAX_H; w = MAX_H * r; }
  const rad = Math.hypot(w * K / Math.cos(Math.PI / N), h / 2);
  if (rad > MAX_RADIUS) { w *= MAX_RADIUS / rad; h *= MAX_RADIUS / rad; }
  return [w, h];
}

/* 포스터 크기: 폰에서 '실제로 보이는 영역'을 직접 재서 1080×1760 전체가 다 들어가게
   (CSS의 vh/dvh는 폰 주소창·하단바 때문에 실제보다 크게 잡혀 아래가 잘릴 수 있음) */
function fitPoster() {
  const vv = window.visualViewport;
  const W = vv ? vv.width  : window.innerWidth;
  const H = vv ? vv.height : window.innerHeight;
  poster.style.width = Math.min(W, H * 1080 / 1760) + 'px';
}

function layout() {
  fitPoster();
  scale = poster.clientWidth / 1080;
  box.style.top = CENTER_Y * scale + 'px';
  band.style.perspective = poster.clientWidth * PERSPECTIVE + 'px';
  band.style.perspectiveOrigin = `50% ${CENTER_Y * scale}px`;
}

function render() {
  const m = qMat(q);
  /* 지금 화면을 보고 있는 방향 → 몇 번째 사진이 앞인지 */
  const yaw = Math.atan2(m[6], m[8]) / RAD;          // 기둥 기준 시선 방향
  const pos = yaw / STEP;
  const i0 = Math.floor(pos), f = pos - i0;
  const e = f * f * (3 - 2 * f);
  const [w0, h0] = sizeFor(i0), [w1, h1] = sizeFor(i0 + 1);
  const w = (w0 + (w1 - w0) * e) * scale;
  const h = (h0 + (h1 - h0) * e) * scale;
  const R = w * K;                       // 옆면까지 거리
  const Rc = R / Math.cos(Math.PI / N);  // 꼭짓점까지 거리

  box.style.width  = w + 'px';
  box.style.height = h + 'px';
  stage.style.transform = `translateZ(${-R}px) matrix3d(${
    [m[0], m[3], m[6], 0, m[1], m[4], m[7], 0, m[2], m[5], m[8], 0, 0, 0, 0, 1].map(v => v.toFixed(6)).join(',')
  })`;

  /* 면이 화면 쪽을 보는 정도(1=정면, 0 이하=뒤) — 뒤를 향한 면은 직접 숨김
     (Safari는 backface-visibility만으로는 뒷면이 비쳐 보이는 경우가 있음) */
  faces.forEach((fc, i) => {
    const a = i * STEP * RAD;
    fc.el.style.transform = `rotateY(${i * STEP}deg) translateZ(${R}px)`;
    const facing = m[6] * Math.sin(a) + m[8] * Math.cos(a);
    fc.el.style.visibility = facing > 0.02 ? 'visible' : 'hidden';
    fc.shade.style.opacity = Math.min(1, Math.max(0, (1 - facing) * SHADE));
  });
  caps.forEach(c => {
    c.el.style.width = c.el.style.height = 2 * Rc + 'px';
    c.el.style.margin = `${-Rc}px 0 0 ${-Rc}px`;
    c.el.style.transform = c.top
      ? `translateY(${-h / 2}px) rotateX(90deg)`
      : `translateY(${h / 2}px) rotateX(-90deg)`;
    const facing = c.top ? -m[7] : m[7];
    c.el.style.visibility = facing > 0.02 ? 'visible' : 'hidden';
    c.shade.setAttribute('fill-opacity', Math.min(1, Math.max(0, (1 - facing) * SHADE)).toFixed(3));
  });

  floor.style.width = w * 1.15 + 'px';
  floor.style.top   = CENTER_Y * scale + h / 2 + 'px';
}

/* 매 프레임: 손 대고 있지 않으면 던진 힘이 줄어들면서 기본 회전으로 부드럽게 복귀 */
let dragging = false, last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!dragging) {
    spin += AUTO_SPEED * dt;
    const decay = Math.exp(-FLING_DECAY * dt);
    flingX *= decay; flingY *= decay;
    if (Math.abs(flingX) + Math.abs(flingY) > 1) {
      q = qNorm(qMul(qMul(qAxis(0, 1, 0, flingX * dt), qAxis(1, 0, 0, flingY * dt)), q));
    }
    /* 던진 힘이 남아 있는 동안은 원위치로 끌어당기는 힘을 약하게 → 휙 도는 느낌 유지 */
    const flingAmt = Math.min(1, (Math.abs(flingX) + Math.abs(flingY)) / 300);
    const ease = 1 - Math.exp(-RETURN * (1 - 0.8 * flingAmt) * dt);
    q = qSlerp(q, baseQ(spin), ease);
  }
  if (q.some(v => !isFinite(v))) q = baseQ(spin);   // 혹시라도 계산이 깨지면 원상복구
  render();
  requestAnimationFrame(tick);
}

/* 터치 / 마우스: 손가락 방향 그대로 굴리기 (360°) */
let lastX = 0, lastY = 0, lastT = 0, activeId = null;
band.addEventListener('pointerdown', e => {
  if (activeId !== null) return;                  // 두 손가락은 무시
  activeId = e.pointerId;
  dragging = true;
  lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
  flingX = flingY = 0;
  band.classList.add('dragging');
  try { band.setPointerCapture(e.pointerId); } catch (_) {}
});
band.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== activeId) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  const dt = Math.max(16, e.timeStamp - lastT) / 1000;
  const ax = dx * DRAG_SPEED, ay = -dy * DRAG_SPEED;
  q = qNorm(qMul(qMul(qAxis(0, 1, 0, ax), qAxis(1, 0, 0, ay)), q));
  flingX = flingX * 0.2 + (ax / dt) * 0.8;        // 마지막 손놀림을 거의 그대로 반영
  flingY = flingY * 0.2 + (ay / dt) * 0.8;
  lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
});
function release(e) {
  if (!dragging || (e && e.pointerId !== activeId)) return;
  dragging = false;               // 손 떼면 바로 다시 돌기 시작
  activeId = null;
  band.classList.remove('dragging');
  const MAXF = 1000;
  flingX = Math.max(-MAXF, Math.min(MAXF, flingX));
  flingY = Math.max(-MAXF, Math.min(MAXF, flingY));
}
band.addEventListener('pointerup', release);
band.addEventListener('pointercancel', release);
band.addEventListener('lostpointercapture', release);

layout();
render();
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
requestAnimationFrame(tick);

/* 안내 화면: 최소 INTRO_MS 동안 보여주고, 배경까지 다 불러오면 사라짐 */
document.getElementById('introMsg').textContent = INTRO_TEXT;
const introStart = performance.now();
